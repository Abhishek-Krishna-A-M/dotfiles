##### ----------------------------------------------------------
##### Prefix Key
##### ----------------------------------------------------------

# Remove the default Ctrl+b prefix
unbind C-b

# Use Ctrl+a instead
set -g prefix C-a
bind C-a send-prefix


##### ----------------------------------------------------------
##### Terminal
##### ----------------------------------------------------------

# True color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Faster Escape key response (important for Neovim)
set -sg escape-time 0


##### ----------------------------------------------------------
##### General
##### ----------------------------------------------------------

# Start numbering windows from 1
set -g base-index 1

# (Not using panes, but keep pane numbering consistent)
setw -g pane-base-index 1

# Automatically renumber windows after closing one
set -g renumber-windows on

# Use vi keybindings in copy mode
setw -g mode-keys vi

# Disable mouse (WM handles mouse interactions)
set -g mouse off


##### ----------------------------------------------------------
##### Status Bar
##### ----------------------------------------------------------

set -g status on


##### ----------------------------------------------------------
##### Window Management
##### ----------------------------------------------------------

# Create a new window
bind c new-window

# Kill current window
bind x kill-window

# Rename current window
bind r command-prompt "rename-window %%"

# List windows
bind w choose-window

# List sessions
bind s choose-session

# Switch to previous/next window (Vim style)
bind h previous-window
bind l next-window

# Quickly return to previous window
bind Tab last-window

# Move window left/right
bind -r H swap-window -t -1
bind -r L swap-window -t +1


##### ----------------------------------------------------------
##### Direct Window Selection
##### ----------------------------------------------------------

bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9


##### ----------------------------------------------------------
##### Session Management
##### ----------------------------------------------------------

# Detach session
bind d detach

# Choose tree (sessions + windows)
bind t choose-tree


##### ----------------------------------------------------------
##### Configuration
##### ----------------------------------------------------------

# Reload config without restarting tmux
bind R source-file ~/.tmux.conf \; display-message "tmux config reloaded"


##### ----------------------------------------------------------
##### Copy Mode (Vim)
##### ----------------------------------------------------------

# Enter copy mode
bind Enter copy-mode

# Vim-style selection
bind -T copy-mode-vi v send-keys -X begin-selection

# Copy selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Rectangle selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Search
bind -T copy-mode-vi / command-prompt -p "Search:" "send-keys -X search-forward '%%'"


##### ----------------------------------------------------------
##### Performance
##### ----------------------------------------------------------

# Reduce status refresh overhead
set -g status-interval 60

# Shorter display messages
set -g display-time 1000

# Reduce focus events (less noise)
set -g focus-events off


##### ----------------------------------------------------------
##### Quality of Life
##### ----------------------------------------------------------

# Activity notifications
setw -g monitor-activity on

# Visual bell instead of terminal bell
set -g visual-bell off
set -g bell-action none

# Longer history
set -g history-limit 100000


##### ----------------------------------------------------------
##### Pane Keybinds
##### ----------------------------------------------------------
#
# Intentionally omitted.
#
# tiling window manager already provides:
#
#   - Splits
#   - Resize
#   - Move
#   - Focus
#
# tmux is used purely for:
#
#   • Sessions
#   • Windows (tabs)
#   • Persistent terminals
#
