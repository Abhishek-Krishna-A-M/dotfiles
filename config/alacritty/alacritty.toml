
[window]
# --- Borders & Padding ---
# Matches foot's pad=4x4
padding = { x = 4, y = 4 }

# Enables your background transparency (alpha=0.8)
opacity = 0.8
blur = true

[scrolling]
# Matches foot's lines=2000
history = 2000

[font]
# Matches foot's pixelsize=16 (approx 12pt depending on DPI, adjusted for size)
size = 12.0

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[cursor]
# Matches foot's style=block & blink=yes
style = { shape = "Block", blinking = "Always" }
blink_interval = 500

[colors.primary]
# Matches your [colors-dark] background=000409 and foreground=dcdcdc
background = "0x000409"
foreground = "0xdcdcdc"

[colors.cursor]
# Matches foot's cursor text/bg layout
text = "0x000409"
cursor = "0xffffff"

[colors.normal]
# Normal colors (0-7)
black   = "0x1a1a1a"
red     = "0xb36868"
green   = "0x789978"
yellow  = "0xa6a68a"
blue    = "0x6d81a3"
magenta = "0x8e74a6"
cyan    = "0x629c9c"
white   = "0xb0b0b0"

[colors.bright]
# Bright colors (8-15)
black   = "0x404040"
red     = "0xd18282"
green   = "0x8eb38e"
yellow  = "0xc4c4a5"
blue    = "0x8ca1c2"
magenta = "0xaa94c2"
cyan    = "0x8bc2c2"
white   = "0xffffff"

[[keyboard.bindings]]
# Clipboard copy
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
# Clipboard paste
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
# Search-start
key = "S"
mods = "Control|Shift"
action = "SearchForward"

[[keyboard.bindings]]
# Font increase combos
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
# Font increase fallback (=)
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
# Font decrease
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
# Font reset (Main keyboard)
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
# Font reset (Numpad)
key = "Numpad0"
mods = "Control"
action = "ResetFontSize"

