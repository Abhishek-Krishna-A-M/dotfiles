# --- foot terminal configuration ---

[main]
# --- Fonts ---
# Fixed Fontconfig syntax to use 'pixelsize' directly
font=FiraCode Nerd Font:pixelsize=16:antialias=true, FiraCode Nerd Font Mono:pixelsize=18:antialias=true
letter-spacing=0

# --- Borders ---
pad=4x4

[scrollback]
lines=2000
indicator-position=none

[cursor]
style=block
blink=yes

# Fixed: Changed from [colors] to [colors-dark] to clear deprecation warnings
[colors-dark]
alpha=0.8
background=000409
foreground=dcdcdc

# Fixed: Moved cursor text/bg colors here from the [cursor] block
cursor=000409 ffffff

# Normal colors (0-7)
regular0=1a1a1a
regular1=b36868
regular2=789978
regular3=a6a68a
regular4=6d81a3
regular5=8e74a6
regular6=629c9c
regular7=b0b0b0

# Bright colors (8-15)
bright0=404040
bright1=d18282
bright2=8eb38e
bright3=c4c4a5
bright4=8ca1c2
bright5=aa94c2
bright6=8bc2c2
bright7=ffffff

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+s

font-increase=Control+plus Control+equal Control+Shift+Page_Up
font-decrease=Control+minus Control+Shift+Page_Down
font-reset=Control+0 Control+KP_0

# Fixed: Unbind default unicode-input to prevent mapping conflicts
unicode-input=none
show-urls-launch=Control+Shift+u
