[main]
# --- Fonts ---
font=FiraCode Nerd Font:pixelsize=16:antialias=true
line-height=18
letter-spacing=0

# --- Padding ---
pad=6x6

[scrollback]
lines=2000
indicator-position=none

[cursor]
style=block
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.85
background=02060c
foreground=e6e6e6

# Cursor colors set correctly here (text_color cursor_bg_color)
cursor=000000 ffffff

# --- Enhanced Original Palette (Shifted for vibrancy) ---
regular0=242424
regular1=c95c5c  # Vibrant Muted Red
regular2=6eb86e  # Crisp Sage Green
regular3=bfa86b  # Warm Olive/Gold
regular4=648cd4  # Clean Classic Blue
regular5=a270d4  # Rich Lavender Purple
regular6=4fb5b5  # Bright Teal
regular7=c2c2c2

# Bright colors (8-15) - High visibility variants
bright0=505050
bright1=f07171   # Pop Red
bright2=85d685   # Pop Green
bright3=e6d27e   # Bright Yellow
bright4=82a8f0   # Bright Sky Blue
bright5=bf8df0   # Bright Soft Purple
bright6=6fe3e3   # Cyan Highlight
bright7=ffffff

# Highlighting text
selection-foreground=ffffff
selection-background=2a3240

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+s

font-increase=Control+plus Control+equal Control+Shift+Page_Up
font-decrease=Control+minus Control+Shift+Page_Down
font-reset=Control+0 Control+KP_0

unicode-input=none
show-urls-launch=Control+Shift+u
